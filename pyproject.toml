[project]
name = "deepseek-search-cli"
version = "1.0.1"
description = "DeepSeek Search and Fetch CLI tool based on httpx and typer"
readme = "README.md"
license = "MIT"
authors = [
    { name = "twn39", email = "twn39@163.com" }
]
requires-python = ">=3.11, <3.15"
keywords = [
    "deepseek",
    "search",
    "fetch",
    "web-search",
    "cli",
    "llm",
    "rag",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1",
    "rich>=13.0.0",
    "typer>=0.27.3",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[project.urls]
Homepage = "https://github.com/twn39/deepseek-search-cli"
Repository = "https://github.com/twn39/deepseek-search-cli"
Issues = "https://github.com/twn39/deepseek-search-cli/issues"
Documentation = "https://api-docs.deepseek.com/zh-cn/guides/search"

[project.scripts]
deepseek-search = "deepseek_search_cli.cli:main"
ds-search = "deepseek_search_cli.cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "src"
module-name = "deepseek_search_cli"
default-excludes = true
source-include = [
    "tests/**",
    "README.md",
    "pyproject.toml",
    "skills/**",
]
source-exclude = [
    ".codegraph/**",
    ".ruff_cache/**",
    ".env*",
    "*.log",
]
wheel-exclude = [
    "*.pyc",
    "*.pyo",
    "__pycache__/**",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # Line length is handled by ruff format
    "B904",  # Allow raise without from in CLI handlers
]

[tool.ruff.lint.isort]
known-first-party = ["deepseek_search_cli"]
